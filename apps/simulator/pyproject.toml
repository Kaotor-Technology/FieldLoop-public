[project]
name = "fieldloop-simulator"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.135.4", "uvicorn==0.42.0", "fieldloop-common", "PyYAML==6.0.3"]

[tool.uv.sources]
fieldloop-common = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldloop_simulator"]

