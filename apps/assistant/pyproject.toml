[project]
name = "fieldloop-assistant"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.135.4",
    "uvicorn==0.42.0",
    "fieldloop-common",
    "fieldloop-adapters",
    "psycopg[binary,pool]==3.3.6",
    "asyncpg==0.32.0",
    "google-adk[db]==2.11.0",
    "litellm==1.104.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "pyjwt[crypto]==2.15.1",
]

[tool.uv.sources]
fieldloop-common = { workspace = true }
fieldloop-adapters = { workspace = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldloop_assistant"]
