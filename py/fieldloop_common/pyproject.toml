[project]
name = "fieldloop-common"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.14.0",
    "rfc3339-validator==0.1.4",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldloop_common"]
