# FieldLoop API conventions (AGENTS.md §2 API, docs/architecture.md §4).
# Every rule is an error: `pnpm lint:api` fails on any finding.
extends:
  - spectral:oas

rules:
  # The base spec defines shared components before any feature path uses them.
  oas3-unused-component: off

  operation-operationId: error
  operation-description: error
  operation-tags: error
  operation-tag-defined: error
  info-contact: error
  info-description: error

  fieldloop-openapi-3-1:
    description: The contract is written in OpenAPI 3.1.
    message: "`openapi` must be 3.1.x."
    severity: error
    given: $.openapi
    then:
      function: pattern
      functionOptions:
        match: "^3\\.1\\.\\d+$"

  fieldloop-path-prefix:
    description: Paths are versioned under /v1. /auth, /guardrail/v1 and /internal are the only other roots (architecture §4.2).
    message: "{{property}} must start with /v1/, /auth/, /guardrail/v1/ or /internal/."
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^/(v1|auth|guardrail/v1|internal)/"

  fieldloop-path-kebab-case:
    description: Path segments are lowercase kebab-case; parameters are camelCase; a command ends with one `:verb`.
    message: "{{property}} must use kebab-case segments, {camelCase} parameters and at most one trailing :verb."
    severity: error
    given: $.paths
    then:
      field: "@key"
      function: pattern
      functionOptions:
        match: "^(/([a-z0-9]+(-[a-z0-9]+)*|\\{[a-z][A-Za-z0-9]*\\}))+(:[a-z]+(-[a-z]+)*)?$"

  fieldloop-command-post-only:
    description: A `:verb` command path defines POST and no other method.
    message: "A `:verb` command path must define `post` and no other method."
    severity: error
    given: "$.paths[?(@property.match(/:[^/]*$/))]"
    then:
      - field: post
        function: truthy
      - field: get
        function: falsy
      - field: put
        function: falsy
      - field: patch
        function: falsy
      - field: delete
        function: falsy

  fieldloop-operation-id-camel-case:
    description: operationId is camelCase, so generated client method names are stable.
    message: "operationId `{{value}}` must be camelCase."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].operationId"
    then:
      function: casing
      functionOptions:
        type: camel

  fieldloop-property-camel-case:
    description: JSON property names are camelCase.
    message: "Property `{{property}}` must be camelCase."
    severity: error
    given: "$..[?(@ && @.type === 'object' && @.properties)].properties"
    then:
      field: "@key"
      function: casing
      functionOptions:
        type: camel

  fieldloop-query-camel-case:
    description: Query parameter names are camelCase.
    message: "Query parameter `{{value}}` must be camelCase."
    severity: error
    given: "$..parameters[?(@ && @.in === 'query')].name"
    then:
      function: casing
      functionOptions:
        type: camel

  fieldloop-error-problem-json:
    description: Every 4xx and 5xx response is RFC 9457 application/problem+json and nothing else.
    message: "An error response must have exactly one media type, application/problem+json."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/))]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [content]
          properties:
            content:
              type: object
              required: [application/problem+json]
              additionalProperties: false
              properties:
                application/problem+json:
                  type: object
                  required: [schema]

  fieldloop-error-problem-schema:
    description: An error body is the shared Problem schema (or extends it).
    message: "An error body must be #/components/schemas/Problem."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].responses[?(@property.match(/^[45]/))].content[application/problem+json].schema"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [required, properties]
          properties:
            required:
              type: array
              allOf:
                - contains: { const: type }
                - contains: { const: title }
                - contains: { const: status }
                - contains: { const: code }

  fieldloop-no-default-response:
    description: Responses list explicit status codes; `default` hides which errors a client must handle.
    message: "Responses must not use `default`; list each status code."
    severity: error
    given: "$.paths[*][get,put,post,patch,delete].responses"
    then:
      field: default
      function: falsy

  fieldloop-session-cookie-scheme:
    description: The session is an HttpOnly cookie named fl_session (ADR-0008).
    message: "components.securitySchemes.sessionCookie must be an apiKey in the cookie `fl_session`."
    severity: error
    given: $.components.securitySchemes
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [sessionCookie]
          properties:
            sessionCookie:
              type: object
              required: [type, in, name]
              properties:
                type: { const: apiKey }
                in: { const: cookie }
                name: { const: fl_session }

  fieldloop-no-browser-token-scheme:
    description: The browser holds no tokens, so the contract declares no OAuth 2, OpenID Connect or query-string key scheme (ADR-0008).
    message: "OAuth 2, OpenID Connect and query-string key schemes are not allowed: use the session cookie."
    severity: error
    given: "$.components.securitySchemes[*]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          not:
            anyOf:
              - properties: { type: { enum: [oauth2, openIdConnect] } }
                required: [type]
              - properties: { type: { const: apiKey }, in: { const: query } }
                required: [type, in]

  fieldloop-global-session-security:
    description: The session cookie is the default security requirement, so an endpoint is public only when it says `security: []`.
    message: "Top-level `security` must be exactly [{ sessionCookie: [] }]."
    severity: error
    given: $
    then:
      field: security
      function: schema
      functionOptions:
        schema:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            required: [sessionCookie]
            additionalProperties: false
            properties:
              sessionCookie: {}

  fieldloop-csrf-on-unsafe-methods:
    description: Every non-GET /v1 operation on a session takes the X-CSRF-Token header (architecture §4.3).
    message: "A non-GET /v1 operation must include #/components/parameters/CsrfToken."
    severity: error
    given: "$.paths[?(@property.match(/^\\/v1\\//))][put,post,patch,delete]"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          if:
            properties:
              security: { type: array, maxItems: 0 }
            required: [security]
          else:
            required: [parameters]
            properties:
              parameters:
                type: array
                contains:
                  type: object
                  required: [name, in, required]
                  properties:
                    name: { const: X-CSRF-Token }
                    in: { const: header }
                    required: { const: true }
