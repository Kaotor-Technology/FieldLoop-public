openapi: 3.1.0
info:
  title: FieldLoop API
  version: 0.1.0
  summary: Base contract for the FieldLoop platform API served by web-api.
  description: |
    Shared conventions and components for the BFF authentication endpoints and
    every `/v1` endpoint. Feature endpoints are added to `paths` by the Jira
    issue that implements them and must pass the Spectral ruleset in
    `.spectral.yaml`. See `README.md` in this package for the conventions.
  contact:
    name: FieldLoop engineering
    url: https://github.com/Kaotor-Technology/FieldLoop-v2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the SPA; web-api mounts backend routes under /api.
security:
  - sessionCookie: []
tags:
  - name: Imports
    description: Safe point import workflow.
  - name: Auth
    description: OIDC sign-in, sign-out and session reauthentication.
  - name: Session
    description: Current signed-in user's BFF session.
  - name: Map
    description: Organisation-scoped map configuration and viewport layers.
  - name: Internal Auth
    description: Internal token verification keys; contains no user data.
  - name: Simulation
    description: Deterministic, sandboxed Scenario player.
  - name: Risk
    description: Organisation-calibrated Bowtie risk scores, snapshots and explanations.
  - name: Evidence
    description: Organisation-scoped source Evidence metadata.
  - name: Health
    description: Barrier Health decisions and in-app notifications.
paths:
  /auth/login:
    get:
      operationId: startLogin
      summary: Start sign-in with Kaotor SSO
      description: Creates a one-time OIDC transaction and redirects to Keycloak. The return path is restricted to this origin.
      tags: [Auth]
      security: []
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after sign-in; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Complete OIDC sign-in
      description: Exchanges the authorization code server-side, consumes one-time state and sets only the opaque `fl_session` cookie.
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the safe return path and set the HttpOnly session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the BFF session
      description: Deletes the server-side session and clears `fl_session`. With Accept application/json, returns a token-free Keycloak logout URL for top-level navigation; otherwise redirects. Keycloak confirms logout because no ID-token hint is sent. Repeated session deletion is safe.
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Token-free logout destination for a browser requesting application/json.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "303":
          description: Redirect to Keycloak's logout endpoint and clear the session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/backchannel-logout:
    post:
      operationId: processBackchannelLogout
      summary: Process Keycloak back-channel logout
      description: Verifies the signed Keycloak logout token and deletes BFF sessions matching its `sid`. This service-to-service callback is intentionally exempt from browser session CSRF.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              patternProperties:
                "^logout_token$": { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "204": { description: Logout sessions deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/reauth:
    get:
      operationId: startReauthentication
      summary: Require a fresh SSO login
      description: Redirects the signed-in user to Keycloak with `prompt=login` and `max_age=0`; the callback updates the same session's `auth_time`.
      tags: [Auth]
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after reauthentication; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user and CSRF token
      description: Returns the authenticated user's server-derived roles and fixed environment Organisation ID.
      tags: [Session]
      responses:
        "200":
          description: Current BFF user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/map/config:
    get:
      operationId: getMapConfig
      summary: Get browser map configuration
      description: Returns the referrer-restricted Google Maps JavaScript API key for the authenticated session.
      tags: [Map]
      responses:
        "200":
          description: Browser map configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/map/layers/{layer}:
    get:
      operationId: getMapLayer
      summary: Get map features within the current viewport
      description: Returns an Organisation- and clearance-filtered GeoJSON layer for a bounded viewport. Demo roles may also read only the explicitly seeded DL-01 and Bangkok records when they are marked simulated.
      tags: [Map]
      parameters:
        - name: layer
          in: path
          required: true
          schema: { type: string, enum: [assets, barriers, consequences] }
        - name: bbox
          in: query
          required: true
          description: West, south, east and north longitude/latitude values in WGS84.
          style: form
          explode: false
          schema:
            type: array
            minItems: 4
            maxItems: 4
            items: { type: number }
        - name: zoom
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: Features visible in the requested viewport.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/MapFeatureCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /internal/auth/jwks:
    get:
      operationId: getInternalAuthJwks
      summary: Get internal user token signing keys
      description: Returns public RSA keys used by internal services to verify five-minute user tokens; no session tokens are exposed.
      tags: [Internal Auth]
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/scenarios:
    get:
      operationId: listScenarios
      summary: List Scenarios
      description: Lists the validated, installed Scenario catalog. All entries are simulated.
      tags:
      - Simulation
      responses:
        '200':
          description: Available Scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs:
    post:
      operationId: createSimulationRun
      summary: Create a SimulationRun
      description: Captures the clean simulated baseline and creates a paused player. Requires Operator or Manager;
        rejects another active run.
      tags:
      - Simulation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/current:
    get:
      operationId: getCurrentSimulationRun
      summary: Read the current SimulationRun
      description: Returns the current run, or null if none has been created. Reading may advance a playing server
        clock.
      tags:
      - Simulation
      responses:
        '200':
          description: Current run or null.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SimulationRun'
                - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:
    get:
      operationId: getSimulationRun
      summary: Read a SimulationRun
      description: Reads server state and advances a playing clock; never accepts client time.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:play:
    post:
      operationId: playSimulationRun
      summary: Play a SimulationRun
      description: Play the server clock. All events travel through the simulation-only Signal publisher.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:pause:
    post:
      operationId: pauseSimulationRun
      summary: Pause a SimulationRun
      description: Pause the server clock. All events travel through the simulation-only Signal publisher.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:step:
    post:
      operationId: stepSimulationRun
      summary: Step a SimulationRun
      description: Advances to the next event time while paused, emitting every event at that time.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:speed:
    post:
      operationId: speedSimulationRun
      summary: Speed a SimulationRun
      description: Changes the server clock speed after advancing at the previous speed.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:bookmark:
    post:
      operationId: bookmarkSimulationRun
      summary: Bookmark a SimulationRun
      description: Advances to a named bookmark while paused; earlier bookmarks require reset first. All intervening
        events are emitted in order.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:reset:
    post:
      operationId: resetSimulationRun
      summary: Reset a SimulationRun
      description: Restores the simulated baseline atomically and returns a new ready run identity. History is retained
        and previous-run writes are fenced. Reset can be retried using the same key.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream live domain and simulation events
      description: SSE emits scoped Health, notification, simulation, and Risk events. Risk events carry a persisted RiskSnapshot and the controlled-standard calibration provenance used to calculate it. Last-Event-ID resumes the event cursor; reconnect reauthenticates.
      tags:
      - Health
      - Simulation
      - Risk
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: Opaque cursor from the previous event, used to resume the stream.
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Event stream for barrier.health_changed, health_proposal.created, evidence.created, notification.delivered, simulation.state, simulation.reset and risk.recalculated.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/bowties:
    get:
      operationId: listBowties
      summary: List Bowties visible to the current Organisation
      description: Returns Bowtie canvas entry points scoped to the signed-in Organisation and clearance.
      tags: [Risk]
      responses:
        '200':
          description: Bowties in the current Organisation.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BowtieSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/bowties/{bowtieId}:
    get:
      operationId: getBowtieCanvas
      summary: Read a Bowtie canvas
      description: Returns the scoped Threat, Barrier, path and Consequence data used by the three-column canvas.
      tags: [Risk]
      parameters:
        - name: bowtieId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Bowtie canvas data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BowtieCanvas' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/bowties/{bowtieId}/risk:
    get:
      operationId: getBowtieRisk
      summary: Read the current Bowtie Risk Score
      description: Calculates with the approved Organisation Risk Matrix, persists a full RiskSnapshot and its controlled-standard reference/version when inputs change, and returns risk_matrix_unconfigured until the matrix, severity criteria and standard provenance have Technical Authority approval.
      tags: [Risk]
      parameters:
        - name: bowtieId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current persisted RiskSnapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskSnapshotEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/bowties/{bowtieId}/risk/explain:
    get:
      operationId: explainBowtieRisk
      summary: Explain the change from the previous RiskSnapshot
      description: Compares the current and previous persisted inputs, orders changed Barriers by calculated consequence-frequency impact and links available source Evidence. With no prior snapshot it explicitly reports no change.
      tags: [Risk]
      parameters:
        - name: bowtieId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Risk score comparison and ranked causes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskExplain' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/evidence/{evidenceId}:
    get:
      operationId: getEvidenceSummary
      summary: Read source Evidence metadata
      description: Returns metadata for a source Evidence record when it belongs to the current Organisation and is within the caller's clearance.
      tags: [Evidence]
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evidence metadata without blob contents or storage credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/health-proposals:
    get:
      operationId: listHealthProposals
      summary: List the signed-in Barrier Owner's open Health Proposals
      description: Returns current open proposals owned by the signed-in user within Organisation and clearance scope, newest first.
      tags: [Health]
      parameters:
      - name: status
        in: query
        required: true
        schema: { type: string, const: open }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's open Health Proposals in reverse chronological order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProposalPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/health-proposals/{healthProposalId}:accept:
    post:
      operationId: acceptHealthProposal
      summary: Accept a Health Proposal
      description: Applies the proposed Health for its Barrier Owner, records an audited Health Change and emits a live event.
      tags: [Health]
      parameters:
      - name: healthProposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthDecision' }
      responses:
        '200':
          description: Accepted decision and current Barrier Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/health-proposals/{healthProposalId}:reject:
    post:
      operationId: rejectHealthProposal
      summary: Reject a Health Proposal
      description: Rejects an open Health Proposal for its Barrier Owner without applying the proposed Health.
      tags: [Health]
      parameters:
      - name: healthProposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthDecision' }
      responses:
        '200':
          description: Rejected decision and unchanged Barrier Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/notifications:
    get:
      operationId: listNotifications
      summary: List current user's in-app notifications
      description: Returns notifications for the signed-in user within Organisation and clearance scope. Evidence expiry notices disappear when newer Evidence arrives.
      tags: [Health]
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's notifications in reverse chronological order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/imports:
    post:
      operationId: createImport
      summary: Upload bounded base64 KML or compressed KML for safe parsing
      description: Upload bounded base64 KML or compressed KML for safe parsing.
        Synthetic/simulated demo records only; imports are scoped to their
        uploader and Organisation.
      tags:
        - Imports
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - format
                - contentBase64
              properties:
                format:
                  type: string
                  enum:
                    - kml
                    - kmz
                contentBase64:
                  type: string
                  maxLength: 2796204
      responses:
