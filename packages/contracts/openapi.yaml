  /v1/imports/{importId}:rollback:
    post:
      operationId: rollbackImport
      summary: Roll back records created by one import batch
      description: Roll back records created by one import batch. Synthetic/simulated
        demo records only; imports are scoped to their uploader and Organisation.
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
