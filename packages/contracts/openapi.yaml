        - url: https://guardrail-{environment}-822853914340.asia-southeast1.run.app
          description: Private Cloud Run Guardrail service; requests require a Google-signed identity token.
          variables:
            environment:
              default: demo
              enum: [dev, demo]
      operationId: scanGuardrailContent
      summary: Scan retrieved or uploaded text before it enters an AI prompt
      description: Detects prompt injection and raises classification when Sensitive Data Protection finds restricted content.
      tags: [Guardrail]
      security:
        - serviceIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-FieldLoop-Internal-User-Token
          in: header
          required: true
          description: Five-minute RS256 token minted by web-api; this token is server-to-server and never sent to the browser.
          schema: { type: string, minLength: 16, maxLength: 8192 }
        - name: X-FieldLoop-Classification
          in: header
          required: false
          description: Caller classification; defaults to INTERNAL.
          schema: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardrailContentScanRequest" }
      responses:
        "200":
          description: Content scan outcome and detected classification.
          headers:
            X-FieldLoop-Policy-Id: { schema: { type: string, format: uuid } }
            X-FieldLoop-Intercept-Id: { schema: { type: string, format: uuid } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardrailContentScanResult" }
