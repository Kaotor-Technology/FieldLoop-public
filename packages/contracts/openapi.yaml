openapi: 3.1.0
info:
  title: FieldLoop API
  version: 0.1.0
  summary: Base contract for the FieldLoop platform API served by web-api.
  description: |
    Shared conventions and components for the BFF authentication endpoints and
    every `/v1` endpoint. Feature endpoints are added to `paths` by the Jira
    issue that implements them and must pass the Spectral ruleset in
    `.spectral.yaml`. See `README.md` in this package for the conventions.
  contact:
    name: FieldLoop engineering
    url: https://github.com/Kaotor-Technology/FieldLoop-v2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the SPA; web-api mounts backend routes under /api.
security:
  - sessionCookie: []
tags:
  - name: Auth
    description: OIDC sign-in, sign-out and session reauthentication.
  - name: Session
    description: Current signed-in user's BFF session.
  - name: Internal Auth
    description: Internal token verification keys; contains no user data.
  - name: Simulation
    description: Deterministic, sandboxed Scenario player.
  - name: Health
    description: Barrier Health decisions and in-app notifications.
paths:
  /auth/login:
    get:
      operationId: startLogin
      summary: Start sign-in with Kaotor SSO
      description: Creates a one-time OIDC transaction and redirects to Keycloak. The return path is restricted to this origin.
      tags: [Auth]
      security: []
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after sign-in; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Complete OIDC sign-in
      description: Exchanges the authorization code server-side, consumes one-time state and sets only the opaque `fl_session` cookie.
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the safe return path and set the HttpOnly session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the BFF session
      description: Deletes the server-side session and clears `fl_session`. With Accept application/json, returns a token-free Keycloak logout URL for top-level navigation; otherwise redirects. Keycloak confirms logout because no ID-token hint is sent. Repeated session deletion is safe.
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Token-free logout destination for a browser requesting application/json.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "303":
          description: Redirect to Keycloak's logout endpoint and clear the session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/backchannel-logout:
    post:
      operationId: processBackchannelLogout
      summary: Process Keycloak back-channel logout
      description: Verifies the signed Keycloak logout token and deletes BFF sessions matching its `sid`. This service-to-service callback is intentionally exempt from browser session CSRF.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              patternProperties:
                "^logout_token$": { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "204": { description: Logout sessions deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/reauth:
    get:
      operationId: startReauthentication
      summary: Require a fresh SSO login
      description: Redirects the signed-in user to Keycloak with `prompt=login` and `max_age=0`; the callback updates the same session's `auth_time`.
      tags: [Auth]
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after reauthentication; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user and CSRF token
      description: Returns the authenticated user's server-derived roles and fixed environment Organisation ID.
      tags: [Session]
      responses:
        "200":
          description: Current BFF user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /internal/auth/jwks:
    get:
      operationId: getInternalAuthJwks
      summary: Get internal user token signing keys
      description: Returns public RSA keys used by internal services to verify five-minute user tokens; no session tokens are exposed.
      tags: [Internal Auth]
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/scenarios:
    get:
      operationId: listScenarios
      summary: List Scenarios
      description: Lists the validated, installed Scenario catalog. All entries are simulated.
      tags:
      - Simulation
      responses:
        '200':
          description: Available Scenarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs:
    post:
      operationId: createSimulationRun
      summary: Create a SimulationRun
      description: Captures the clean simulated baseline and creates a paused player. Requires Operator or Manager;
        rejects another active run.
      tags:
      - Simulation
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/current:
    get:
      operationId: getCurrentSimulationRun
      summary: Read the current SimulationRun
      description: Returns the current run, or null if none has been created. Reading may advance a playing server
        clock.
      tags:
      - Simulation
      responses:
        '200':
          description: Current run or null.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SimulationRun'
                - type: 'null'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:
    get:
      operationId: getSimulationRun
      summary: Read a SimulationRun
      description: Reads server state and advances a playing clock; never accepts client time.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:play:
    post:
      operationId: playSimulationRun
      summary: Play a SimulationRun
      description: Play the server clock. All events travel through the simulation-only Signal publisher.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:pause:
    post:
      operationId: pauseSimulationRun
      summary: Pause a SimulationRun
      description: Pause the server clock. All events travel through the simulation-only Signal publisher.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:step:
    post:
      operationId: stepSimulationRun
      summary: Step a SimulationRun
      description: Advances to the next event time while paused, emitting every event at that time.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:speed:
    post:
      operationId: speedSimulationRun
      summary: Speed a SimulationRun
      description: Changes the server clock speed after advancing at the previous speed.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:bookmark:
    post:
      operationId: bookmarkSimulationRun
      summary: Bookmark a SimulationRun
      description: Advances to a named bookmark while paused; earlier bookmarks require reset first. All intervening
        events are emitted in order.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/simulation/runs/{runId}:reset:
    post:
      operationId: resetSimulationRun
      summary: Reset a SimulationRun
      description: Restores the simulated baseline atomically and returns a new ready run identity. History is retained
        and previous-run writes are fenced. Reset can be retried using the same key.
      tags:
      - Simulation
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Current SimulationRun identity.
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerCommand'
      responses:
        '200':
          description: Server-authoritative simulation state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/events:
    get:
      operationId: streamEvents
      summary: Stream live domain and simulation events
      description: SSE emits scoped health and notification events with simulation snapshots. Last-Event-ID resumes the
        event cursor. Simulation reset invalidates all client caches. The stream is limited to a session validation
        window; reconnect reauthenticates.
      tags:
      - Health
      - Simulation
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: Opaque cursor from the previous event, used to resume the stream.
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Event stream for barrier.health_changed, health_proposal.created, notification.delivered,
            simulation.state and simulation.reset.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/health-proposals/{healthProposalId}:accept:
    post:
      operationId: acceptHealthProposal
      summary: Accept a Health Proposal
      description: Applies the proposed Health for its Barrier Owner, records an audited Health Change and emits a live event.
      tags: [Health]
      parameters:
      - name: healthProposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthDecision' }
      responses:
        '200':
          description: Accepted decision and current Barrier Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/health-proposals/{healthProposalId}:reject:
    post:
      operationId: rejectHealthProposal
      summary: Reject a Health Proposal
      description: Rejects an open Health Proposal for its Barrier Owner without applying the proposed Health.
      tags: [Health]
      parameters:
      - name: healthProposalId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthDecision' }
      responses:
        '200':
          description: Rejected decision and unchanged Barrier Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/notifications:
    get:
      operationId: listNotifications
      summary: List current user's in-app notifications
      description: Returns notifications for the signed-in user within Organisation and clearance scope. Evidence expiry notices disappear when newer Evidence arrives.
      tags: [Health]
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Current user's notifications in reverse chronological order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fl_session
      description: |
        Opaque server-side session ID set by `GET /auth/callback` (HttpOnly,
        Secure, SameSite=Lax). The browser never holds a token (ADR-0008).
        State-changing requests must also send `X-CSRF-Token`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor` of the previous page. Omit it for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session CSRF token returned by `GET /v1/me`. Required on every non-GET request.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key, unique per intended command. Repeating a request
        with the same key and the same body returns the first result; the same
        key with a different body is rejected with `idempotency_key_reused`.
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    # BEGIN generated simulation schemas
    SimulationRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        scenarioId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        scenarioName:
          type: string
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
        clock:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        state:
          type: string
          enum:
          - ready
          - playing
          - paused
          - finished
        nextEventIndex:
          type: integer
          minimum: 0
        eventCount:
          type: integer
          minimum: 0
        simulated:
          const: true
        classification:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - HIGHLY_RESTRICTED
        bookmarks:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                not:
                  pattern: '[\r\n]'
              name:
                type: string
                minLength: 1
                maxLength: 120
              atSeconds:
                type: number
                minimum: 0
            required:
            - id
            - name
            - atSeconds
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - orgId
      - scenarioId
      - scenarioName
      - seed
      - speed
      - clock
      - elapsedSeconds
      - durationSeconds
      - state
      - nextEventIndex
      - eventCount
      - simulated
      - classification
      - bookmarks
      - revision
    RunCreate:
      type: object
      additionalProperties: false
      properties:
        scenarioId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
      required:
      - scenarioId
      - seed
      - speed
    PlayerCommand:
      type: object
      additionalProperties: false
      properties:
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
        bookmarkId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
      required: []
    HealthDecision:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required: [reason]
    HealthDecisionResult:
      type: object
      additionalProperties: false
      properties:
        healthProposalId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected] }
        barrierId: { type: string, format: uuid }
        health: { type: string, enum: [healthy, degraded, failed, unverified] }
      required: [healthProposalId, status, barrierId, health]
    Notification:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [action_request, health_change, evidence] }
        subjectId: { type: string, format: uuid }
        barrierId: { type: [string, 'null'], format: uuid }
        channel: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
      required: [id, subjectType, subjectId, barrierId, channel, status, createdAt, simulated, classification]
    NotificationPage:
      allOf:
      - $ref: '#/components/schemas/CursorPage'
      - type: object
        properties:
          items:
            type: array
            items: { $ref: '#/components/schemas/Notification' }
          limit: { type: integer, minimum: 1, maximum: 200 }
        required: [items, limit]
    ScenarioSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        name:
          type: string
        version:
          type: string
        durationSeconds:
          type: number
        simulated:
          const: true
        classification:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - HIGHLY_RESTRICTED
      required:
      - id
      - name
      - version
      - durationSeconds
      - simulated
      - classification
    # END generated simulation schemas
    CurrentUser:
      type: object
      required: [sub, roles, persona, orgId, clearance, csrfToken, authTime]
      properties:
        sub: { type: string }
        roles:
          type: array
          items: { type: string, enum: [fieldloop.viewer, fieldloop.operator, fieldloop.manager] }
        persona: { type: string }
        orgId: { type: string }
        clearance: { type: string }
        csrfToken: { type: string }
        authTime: { type: string, format: date-time }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, n, e, kid, use, alg]
            properties:
              kty: { type: string, const: RSA }
              n: { type: string }
              e: { type: string }
              kid: { type: string }
              use: { type: string, const: sig }
              alg: { type: string, const: RS256 }

    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `title` or `detail`.
      enum:
        - validation_failed
        - unauthenticated
        - csrf_token_invalid
        - reauthentication_required
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - idempotency_key_reused
        - payload_hash_mismatch
        - rate_limited
        - internal_error
        - service_unavailable

    Problem:
      type: object
      description: RFC 9457 problem details, with FieldLoop extension members `code`, `traceId` and `errors`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never contains restricted data.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies this occurrence.
        code:
          $ref: "#/components/schemas/ErrorCode"
        traceId:
          type: string
          description: OpenTelemetry trace ID of the request, for support and audit.
        errors:
          type: array
          description: Field-level errors. Present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required:
        - pointer
        - detail
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid body member, or `#/query/<name>` or `#/header/<name>` for a parameter.
        detail:
          type: string
          description: What is wrong with the value.

    CursorPage:
      type: object
      description: |
        Envelope of every list response. A feature schema composes it with
        `allOf` and adds a required `items` array.
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - "null"
          description: Cursor for the next page, or `null` on the last page.

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No valid session (`unauthenticated`). The SPA sends the user to `/auth/login`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The session may not do this: `forbidden`, `csrf_token_invalid`, or
        `reauthentication_required` when an approval needs a fresh login.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist or is outside the caller's scope (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: |
        The request conflicts with the current state: `conflict`,
        `idempotency_key_reused` or `payload_hash_mismatch`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The caller is rate limited (`rate_limited`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected server error (`internal_error`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency is unavailable (`service_unavailable`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
