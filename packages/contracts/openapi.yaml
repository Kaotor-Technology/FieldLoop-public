openapi: 3.1.0
info:
  title: FieldLoop API
  version: 0.1.0
  summary: Base contract for the FieldLoop platform API served by web-api.
  description: |
    Shared conventions and components for the BFF authentication endpoints and
    every `/v1` endpoint. Feature endpoints are added to `paths` by the Jira
    issue that implements them and must pass the Spectral ruleset in
    `.spectral.yaml`. See `README.md` in this package for the conventions.
  contact:
    name: FieldLoop engineering
    url: https://github.com/Kaotor-Technology/FieldLoop-v2
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin as the SPA; web-api mounts backend routes under /api.
security:
  - sessionCookie: []
tags:
  - name: Assistant
    description: Guardrail-backed Agent Chat sessions, live turns and cancellation.
  - name: Imports
    description: Safe point import workflow.
  - name: Auth
    description: OIDC sign-in, sign-out and session reauthentication.
  - name: Session
    description: Current signed-in user's BFF session.
  - name: Map
    description: Organisation-scoped map configuration and viewport layers.
  - name: Geo References
    description: Human-reviewed locations extracted from controlled documents.
  - name: Agent Tools
    description: Restricted service-to-service endpoints used by the assistant runtime.
  - name: Internal Auth
    description: Internal token verification keys; contains no user data.
  - name: Simulation
    description: Deterministic, sandboxed Scenario player.
  - name: Risk
    description: Organisation-calibrated Bowtie risk scores, snapshots and explanations.
  - name: Evidence
    description: Organisation-scoped source Evidence metadata.
  - name: Health
    description: Barrier Health decisions and in-app notifications.
  - name: Audit
    description: Read-only, hash-chained audit events within Organisation and clearance scope.
  - name: Guardrail
    description: Internal service-to-service OpenAI-compatible model gateway and Tier 1 content scan.
  - name: Actions
    description: Exact payload proposals and human action ceilings.
paths:
  /v1/assistant/sessions:
    post:
      operationId: createAgentSession
      summary: Start an Agent Chat session
      description: Starts a demo coordinator session as the cookie-authenticated user. Internal credentials remain in the BFF.
      tags: [Assistant]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionCreate'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/assistant/sessions/{sessionId}/messages:
    post:
      operationId: sendAgentMessage
      summary: Stream an Agent turn
      description: Streams live steps and the final structured answer from the Guardrail-backed assistant. A session runs one turn at a time.
      tags: [Assistant]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentMessageCreate'
      responses:
        '200':
          description: SSE agent.step, tool.call, tool.result, guardrail.decision and answer.final/incomplete/error events. Answer data follows the existing assistant runtime contract.
          content:
            text/event-stream:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/assistant/sessions/{sessionId}:cancel:
    post:
      operationId: cancelAgentTurn
      summary: Stop a running Agent turn
      description: Requests cancellation between steps. Existing proposals remain in their human approval flow.
      x-idempotency-exempt: Repeated cancellation only sets the same cancelling status and has no additional effect.
      tags: [Assistant]
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cancelling]
                properties:
                  cancelling: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /v1/action-requests:
    post:
      operationId: createActionRequest
      summary: Prepare a proposed human action
      description: Stores the exact L1/L2 payload with database-generated SHA-256,
        rationale, citations, session identity and bounded SLA. L0 recommendations
        have no record. Never executes the payload. Replays return the current
        record.
      tags:
        - Actions
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequestCreate"
      responses:
        "201":
          description: Action Request created or idempotently replayed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequest"
        "400": &a1
          $ref: "#/components/responses/BadRequest"
        "401": &a2
          $ref: "#/components/responses/Unauthenticated"
        "403": &a3
          $ref: "#/components/responses/Forbidden"
        "409": &a4
          $ref: "#/components/responses/Conflict"
        "503": &a5
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/action-requests/{actionRequestId}:
    get:
      operationId: getActionRequest
      summary: Read an Action Request
      description: Returns an Organisation and clearance scoped current Action
        Request; an expired request is rejected and escalated. Retired simulation
        records are unavailable.
      tags:
        - Actions
      parameters:
        - name: actionRequestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Exact stored payload and generated hash.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionRequest"
        "400": *a1
        "401": *a2
        "403": *a3
        "404":
          $ref: "#/components/responses/NotFound"
        "409": *a4
        "503": *a5
  /guardrail/v1/tool-calls:check:
    post:
      servers:
        - url: https://guardrail-{environment}-822853914340.asia-southeast1.run.app
          description: Private Guardrail; Google service identity and verified internal
            user token required.
          variables:
            environment:
              default: demo
              enum:
                - dev
                - demo
      operationId: checkToolCall
      summary: Check a registered tool call against Action Level ceilings
      description: Uses registered AI System tools and target policy. Returns allow
        for reads/recommendations, convert_l1 with an Action Request, hold_l2 with
        an exact-payload Held Request, or block. Never invokes a tool or writes a
        target system. Above-ceiling and unknown tools are blocked; policy/storage
        failures fail closed.
      tags:
        - Guardrail
      security:
        - serviceIdentity: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-FieldLoop-Internal-User-Token
          in: header
          required: true
          description: Five-minute server-to-server RS256 user token.
          schema:
            type: string
            minLength: 16
            maxLength: 8192
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolCallCheck"
      responses:
        "200":
          description: Persisted decision and any proposed/held records. A block is a
            successful check and forbids tool execution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallDecision"
        "400": *a1
        "401":
          $ref: "#/components/responses/GuardrailUnauthenticated"
        "403":
          $ref: "#/components/responses/GuardrailForbidden"
        "409": *a4
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503": *a5
  /auth/login:
    get:
      operationId: startLogin
      summary: Start sign-in with Kaotor SSO
      description: Creates a one-time OIDC transaction and redirects to Keycloak. The return path is restricted to this origin.
      tags: [Auth]
      security: []
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after sign-in; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/callback:
    get:
      operationId: completeLogin
      summary: Complete OIDC sign-in
      description: Exchanges the authorization code server-side, consumes one-time state and sets only the opaque `fl_session` cookie.
      tags: [Auth]
      security: []
      parameters:
        - name: code
          in: query
          required: false
          schema: { type: string, minLength: 1 }
        - name: state
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        "303":
          description: Redirect to the safe return path and set the HttpOnly session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/logout:
    post:
      operationId: logout
      summary: End the BFF session
      description: Deletes the server-side session and clears `fl_session`. With Accept application/json, returns a token-free Keycloak logout URL for top-level navigation; otherwise redirects. Keycloak confirms logout because no ID-token hint is sent. Repeated session deletion is safe.
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Token-free logout destination for a browser requesting application/json.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl]
                properties:
                  redirectUrl: { type: string, format: uri }
        "303":
          description: Redirect to Keycloak's logout endpoint and clear the session cookie.
          headers:
            Location:
              schema: { type: string, format: uri }
            Set-Cookie:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/backchannel-logout:
    post:
      operationId: processBackchannelLogout
      summary: Process Keycloak back-channel logout
      description: Verifies the signed Keycloak logout token and deletes BFF sessions matching its `sid`. This service-to-service callback is intentionally exempt from browser session CSRF.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              patternProperties:
                "^logout_token$": { type: string, minLength: 1 }
              additionalProperties: false
      responses:
        "204": { description: Logout sessions deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /auth/reauth:
    get:
      operationId: startReauthentication
      summary: Require a fresh SSO login
      description: Redirects the signed-in user to Keycloak with `prompt=login` and `max_age=0`; the callback updates the same session's `auth_time`.
      tags: [Auth]
      parameters:
        - name: return
          in: query
          required: false
          description: Same-origin path to open after reauthentication; unsafe paths fall back to `/`.
          schema: { type: string, maxLength: 2048 }
      responses:
        "302":
          description: Redirect to Keycloak's authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current user and CSRF token
      description: Returns the authenticated user's server-derived roles and fixed environment Organisation ID.
      tags: [Session]
      responses:
        "200":
          description: Current BFF user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/map/config:
    get:
      operationId: getMapConfig
      summary: Get browser map configuration
      description: Returns the referrer-restricted Google Maps JavaScript API key for the authenticated session.
      tags: [Map]
      responses:
        "200":
          description: Browser map configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/assets/{assetId}:
    get:
      operationId: getAsset
      summary: Read one Asset by identifier or asset code
      description: Returns the Asset visible to the signed-in Organisation and clearance. Also readable with the five-minute internal user token as a Bearer credential. That credential is accepted only on the GET routes behind the assistant tools (this route, /v1/bowties/{bowtieId}, /v1/bowties/{bowtieId}/risk and /v1/simulation/runs/current) and never for a state change, a decision or the event stream.
      tags: [Map]
      parameters:
        - name: assetId
          in: path
          required: true
          description: Asset UUID or asset code, for example DL-01.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
      responses:
        "200":
          description: The scoped Asset.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/assets/{assetId}/strip:
    get:
      operationId: getAssetStrip
      summary: Read the pre-authored Chainage strip for an Asset
      description: Returns the server-authorized static seed strip for DL-01. The strip is a read-only snapshot and is not synchronized with the viewport or live Barrier Health.
      tags: [Map]
      parameters:
        - name: assetId
          in: path
          required: true
          description: Asset UUID or asset code, for example DL-01.
          schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
      responses:
        "200":
          description: Static, scoped Chainage strip data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetStripBand" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/map/layers/{layer}:
    get:
      operationId: getMapLayer
      summary: Get map features within the current viewport
      description: Returns an Organisation- and clearance-filtered GeoJSON layer for a bounded viewport. Demo roles may also read only the explicitly seeded DL-01 and Bangkok records when they are marked simulated.
      tags: [Map]
      parameters:
        - name: layer
          in: path
          required: true
          schema: { type: string, enum: [assets, barriers, consequences, geo-references] }
        - name: bbox
          in: query
          required: true
          description: West, south, east and north longitude/latitude values in WGS84.
          style: form
          explode: false
          schema:
            type: array
            minItems: 4
            maxItems: 4
            items: { type: number }
        - name: zoom
          in: query
          required: true
          schema: { type: integer, minimum: 0, maximum: 22 }
      responses:
        "200":
          description: Features visible in the requested viewport.
          content:
            application/geo+json:
              schema: { $ref: "#/components/schemas/MapFeatureCollection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/geo-references:
    get:
      operationId: listDraftGeoReferences
      summary: List Geo Reference drafts awaiting human review
      description: Returns only Draft Geo References visible to the signed-in user's Organisation and clearance. Drafts are never returned by the map layer.
      tags: [Geo References]
      parameters:
        - name: status
          in: query
          required: true
          schema: { type: string, const: draft }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A bounded page of Geo Reference drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoReferencePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/geo-references/{geoReferenceId}:confirm:
    post:
      operationId: confirmGeoReference
      summary: Confirm a Geo Reference draft
      description: Confirms a human-reviewed location. An optional Asset ID lets the reviewer locate a Chainage reference on the selected Asset. Only confirmed records with geometry appear on the map.
      tags: [Geo References]
      parameters:
        - name: geoReferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeoReferenceConfirm" }
      responses:
        "200":
          description: The confirmed Geo Reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /v1/geo-references/{geoReferenceId}:reject:
    post:
      operationId: rejectGeoReference
      summary: Reject a Geo Reference draft
      description: Records a human decision to reject an extracted location. Rejected records are not shown on the map.
      tags: [Geo References]
      parameters:
        - name: geoReferenceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The rejected Geo Reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /internal/assistant/documents/{documentId}/geo-source:
    get:
      operationId: getAssistantGeoSource
      summary: Read a controlled document for geo-extraction
      description: Returns bounded, clearance-checked document text to the assistant service. Requires a signed five-minute internal user token and is not a browser endpoint.
      tags: [Agent Tools]
      security:
        - internalUserToken: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The controlled document text and provenance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoSourceDocument" }
        "401": { $ref: "#/components/responses/GuardrailUnauthenticated" }
        "403": { $ref: "#/components/responses/GuardrailForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /internal/assistant/documents/{documentId}/geo-references:
    post:
      operationId: createAssistantGeoReferenceDrafts
      summary: Save extracted Geo References as drafts
      description: Saves only validated Draft Geo References from a clearance-checked document. The service cannot confirm or place them on the map.
      tags: [Agent Tools]
      security:
        - internalUserToken: []
      parameters:
        - name: documentId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeoReferenceDraftCreate" }
      responses:
        "201":
          description: Draft references created or the matching extraction replayed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeoReferenceDraftCreateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/GuardrailUnauthenticated" }
        "403": { $ref: "#/components/responses/GuardrailForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /internal/auth/jwks:
    get:
      operationId: getInternalAuthJwks
      summary: Get internal user token signing keys
      description: Returns public RSA keys used by internal services to verify five-minute user tokens; no session tokens are exposed.
      tags: [Internal Auth]
      security: []
      responses:
        "200":
          description: Public JSON Web Key Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jwks" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /guardrail/v1/chat/completions:
    post:
      servers:
        - url: https://guardrail-{environment}-822853914340.asia-southeast1.run.app
          description: Private Cloud Run Guardrail service; requests require a Google-signed identity token.
          variables:
            environment:
              default: demo
              enum: [dev, demo]
      operationId: createGuardrailChatCompletion
      summary: Scan, route and proxy an OpenAI-compatible chat completion
      description: Uses the registered AI System's enforce-mode Tier 1 policies. Model output is scanned before any JSON or buffered SSE response is returned.
      tags: [Guardrail]
      security:
        - serviceIdentity: []
      parameters:
        - name: X-FieldLoop-Internal-User-Token
          in: header
          required: true
          description: Five-minute RS256 token minted by web-api; this token is server-to-server and never sent to the browser.
          schema: { type: string, minLength: 16, maxLength: 8192 }
        - name: X-FieldLoop-Classification
          in: header
          required: false
          description: Caller classification; defaults to INTERNAL and is raised when SDP detects more sensitive data.
          schema: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardrailChatCompletionRequest" }
      responses:
        "200":
          description: OpenAI-compatible completion. Streaming requests receive a buffered SSE response after output scanning.
          headers:
            X-FieldLoop-Policy-Id: { schema: { type: string, format: uuid } }
            X-FieldLoop-Intercept-Id: { schema: { type: string, format: uuid } }
            X-FieldLoop-Classification: { schema: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] } }
          content:
