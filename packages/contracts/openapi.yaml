        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Upload limit exceeded.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/options:
    get:
      operationId: getImportOptions
      summary: List eligible simulated linear Assets and linked Barriers
      description: List eligible simulated linear Assets and linked Barriers.
        Synthetic/simulated demo records only; imports are scoped to their
        uploader and Organisation.
      tags:
        - Imports
      parameters: []
      responses:
        "200":
          description: Import state or available targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportOptions"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/imports/{importId}/preview:
    get:
      operationId: getImportPreview
      summary: Resume an import with persisted preview and mapping
      description: Resume an import with persisted preview and mapping.
        Synthetic/simulated demo records only; imports are scoped to their
        uploader and Organisation.
      tags:
        - Imports
      parameters:
        - name: importId
          in: path
