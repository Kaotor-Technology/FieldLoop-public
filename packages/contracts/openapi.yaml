  /v1/audit:
    get:
      operationId: listAuditEvents
      summary: List audit events, newest first
      description: |
        Returns audit events of the signed-in user's Organisation, within the user's clearance, newest
        first. `entityType` is the namespace of the event action (`barrier` for `barrier.health_changed`)
        and `entityId` is the audited entity identifier; both are optional exact-match filters. Events
        are append-only; this endpoint never changes them. Restricted to operators and managers.
      tags: [Audit]
      parameters:
      - name: entityType
        in: query
        description: Action namespace to match, for example `health_proposal`, `barrier` or `simulation`.
        schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
      - name: entityId
        in: query
        description: Identifier of the audited entity to match exactly.
        schema: { type: string, minLength: 1, maxLength: 256 }
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit events in reverse chronological order.
          headers:
            Cache-Control:
              description: Always `private, no-store`.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    internalUserToken:
      type: apiKey
      in: header
      name: x-fieldloop-internal-user-token
      description: Five-minute signed user identity token for server-to-server calls; never sent to the browser.
    serviceIdentity:
      type: http
      scheme: bearer
      bearerFormat: Google-signed Cloud Run identity token
      description: Service-to-service identity verified by Cloud Run invoker IAM.
    sessionCookie:
      type: apiKey
      in: cookie
      name: fl_session
      description: |
        Opaque server-side session ID set by `GET /auth/callback` (HttpOnly,
        Secure, SameSite=Lax). The browser never holds a token (ADR-0008).
        State-changing requests must also send `X-CSRF-Token`.

  parameters:
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor` of the previous page. Omit it for the first page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: Maximum number of items in the page.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Per-session CSRF token returned by `GET /v1/me`. Required on every non-GET request.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated key, unique per intended command. Repeating a request
        with the same key and the same body returns the first result; the same
        key with a different body is rejected with `idempotency_key_reused`.
      schema:
        type: string
        minLength: 16
        maxLength: 128

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  schemas:
    AgentSessionCreate:
      type: object
      additionalProperties: false
      required: [agent]
      properties:
        agent: { type: string, enum: [integrity-orchestrator, flood-situation] }
    AgentMessageCreate:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
    AgentSession:
      type: object
      additionalProperties: false
      required: [id, agent, simulated, classification, status]
      properties:
        id: { type: string, format: uuid }
        agent: { type: string, enum: [integrity-orchestrator, flood-situation] }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        status: { type: string }
    ImportMapping:
      type: object
      additionalProperties: false
      required:
        - assetId
        - toleranceMetres
        - nameField
        - descriptionField
        - categoryField
        - target
        - barrierId
      properties:
        assetId:
          type: string
          format: uuid
        toleranceMetres:
          type: number
          minimum: 0
          maximum: 1000
        nameField:
          type: string
          maxLength: 200
        descriptionField:
          type: string
          maxLength: 200
        categoryField:
          type: string
          maxLength: 200
        target:
          type: string
          enum:
            - evidence
            - facility
        barrierId:
          type:
            - string
            - "null"
          format: uuid
    ImportPoint:
      type: object
      additionalProperties: false
      required:
        - id
        - longitude
        - latitude
        - attributes
        - distanceMetres
        - chainageMetres
        - flags
      properties:
        id:
          type: string
          format: uuid
        longitude:
          type: number
          minimum: -180
          maximum: 180
        latitude:
          type: number
          minimum: -90
          maximum: 90
        attributes:
          type: object
          additionalProperties:
            type: string
        distanceMetres:
          type:
            - number
            - "null"
        chainageMetres:
          type:
            - number
            - "null"
        flags:
          type: array
          items:
            type: string
    ImportPreview:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - version
        - classification
        - fileHash
        - createdAt
        - mapping
        - points
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - preview
            - mapped
            - committed
            - rolled_back
        version:
          type: integer
          minimum: 1
        classification:
          type: string
        fileHash:
          type: string
        createdAt:
          type: string
          format: date-time
        mapping:
          anyOf:
            - $ref: "#/components/schemas/ImportMapping"
            - type: "null"
        points:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/ImportPoint"
    ImportOptions:
      type: object
      additionalProperties: false
      required:
        - assets
        - barriers
      properties:
        assets:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
            properties:
              id:
                type: string
              name:
                type: string
        barriers:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - name
              - assetId
            properties:
              id:
                type: string
              name:
                type: string
              assetId:
                type: string

    # BEGIN generated action schemas
    ActionLevel:
      type: string
      enum:
        - l0
        - l1
        - l2
    ActionType:
      type: string
      enum:
        - internal_record
        - system_of_record
        - field_command
        - engineering_approval
        - emergency_communication
        - external_submission
    ActionClassification:
      type: string
      enum:
        - PUBLIC
        - INTERNAL
        - CONFIDENTIAL
        - HIGHLY_RESTRICTED
    ActionTarget:
      type: string
      enum:
        - fieldloop
        - cmms
        - integrity-database
        - gis
        - asset-register
        - siem
        - historian
        - scada
        - ot
        - engineering-authority
        - stakeholders
        - regulator
        - external-party
    ActionRequestCreate:
      type: object
      additionalProperties: false
      required:
        - actionType
        - actionLevel
        - target
        - payload
        - rationale
        - citations
        - simulated
        - classification
      properties:
        actionType:
          $ref: "#/components/schemas/ActionType"
        actionLevel:
          $ref: "#/components/schemas/ActionLevel"
        target:
          $ref: "#/components/schemas/ActionTarget"
        payload:
          type: object
          additionalProperties: true
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        citations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: \S
        simulated:
          type: boolean
        classification:
          $ref: "#/components/schemas/ActionClassification"
        expiresAt:
          type: string
          format: date-time
        simulationRunId:
          type: string
          format: uuid
    ToolCallCheck:
      type: object
      additionalProperties: false
      required:
        - aiSystem
        - tool
        - target
        - simulated
        - classification
      properties:
        actionType:
          $ref: "#/components/schemas/ActionType"
        actionLevel:
          $ref: "#/components/schemas/ActionLevel"
        target:
          $ref: "#/components/schemas/ActionTarget"
        payload:
          type: object
          additionalProperties: true
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        citations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: \S
        simulated:
          type: boolean
        classification:
          $ref: "#/components/schemas/ActionClassification"
        expiresAt:
          type: string
          format: date-time
        simulationRunId:
          type: string
          format: uuid
        aiSystem:
          type: string
          minLength: 1
          maxLength: 128
        tool:
          type: string
          minLength: 1
          maxLength: 128
    ActionRequester:
      description: Who requested the action (PRD AX-1). An assistant acts on behalf of
        requestedBy.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              const: person
        - type: object
          additionalProperties: false
          required:
            - kind
            - aiSystemId
          properties:
            kind:
              const: assistant
            aiSystemId:
              type: string
              format: uuid
    ActionRequest:
      type: object
      additionalProperties: false
      required:
        - id
        - orgId
        - actionType
        - actionLevel
        - target
        - payload
        - payloadHash
        - rationale
        - citations
        - requestedBy
        - requester
        - status
        - expiresAt
        - simulated
        - classification
      properties:
        actionType:
          $ref: "#/components/schemas/ActionType"
        actionLevel:
          $ref: "#/components/schemas/ActionLevel"
        target:
          $ref: "#/components/schemas/ActionTarget"
        payload:
          type: object
          additionalProperties: true
        rationale:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: \S
        citations:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 2048
            pattern: \S
        simulated:
          type: boolean
        classification:
          $ref: "#/components/schemas/ActionClassification"
        expiresAt:
          type: string
          format: date-time
        simulationRunId:
          type: string
          format: uuid
        id:
          type: string
          format: uuid
        orgId:
          type: string
          minLength: 1
          maxLength: 128
        payloadHash:
          type: string
          pattern: ^[a-f0-9]{64}$
        requestedBy:
          type: string
          minLength: 1
          maxLength: 512
        requester:
          $ref: "#/components/schemas/ActionRequester"
        status:
          type: string
          enum:
            - open
            - in_review
            - approved
            - rejected
            - superseded
            - executed
    ToolCallDecision:
      type: object
      additionalProperties: false
      required:
        - decision
        - reason
      properties:
        decision:
          type: string
          enum:
            - allow
            - convert_l1
            - hold_l2
            - block
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        ceiling:
          $ref: "#/components/schemas/ActionLevel"
        actionRequest:
          $ref: "#/components/schemas/ActionRequest"
        heldRequestId:
          type: string
          format: uuid
    # END generated action schemas

    GuardrailChatCompletionRequest:
      type: object
      required: [aiSystem, messages]
      properties:
        aiSystem: { type: string, minLength: 1, maxLength: 128 }
        model: { type: string, enum: [flash, pro], description: Logical route class; the caller never selects a model ID or provider. }
        stream: { type: boolean, description: Streaming is buffered until Tier 1 output checks complete. }
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [role]
            properties:
              role: { type: string, enum: [system, developer, user, assistant, tool] }
              content: { type: [string, "null"] }
            additionalProperties: true
      additionalProperties: true

    GuardrailChatCompletionResponse:
      type: object
      required: [choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { type: object, additionalProperties: true }
            additionalProperties: true
      additionalProperties: true

    GuardrailContentScanRequest:
      type: object
      required: [aiSystem, content]
      properties:
        aiSystem: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, maxLength: 250000 }
      additionalProperties: false

    GuardrailContentScanResult:
      type: object
      required: [decision, content, classification, policyId]
      properties:
        decision: { type: string, enum: [allow, reroute] }
        content: { type: string }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        policyId: { type: string, format: uuid }
        reason: { type: string }
      additionalProperties: false

    AssetRecord:
      type: object
      additionalProperties: false
      required: [id, type, name, code, label, domainPack, simulated, classification, geometry]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        code: { type: [string, 'null'] }
        label: { type: [string, 'null'], description: SIMULATION or SYNTHETIC label shown with the Asset. }
        domainPack: { type: [string, 'null'] }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        geometry: { description: GeoJSON geometry or null. }

    AssetStripBand:
      type: object
      additionalProperties: false
      required: [schemaVersion, assetCode, lengthM, classification, simulated, label, segments, facilities, barriers, inspections, threatCategories]
      properties:
        schemaVersion: { type: integer, const: 1 }
        assetCode: { type: string }
        lengthM: { type: number, exclusiveMinimum: 0 }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        simulated: { type: boolean, const: true }
        label: { type: string, const: SYNTHETIC }
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, chainageFromM, chainageToM]
            properties:
              id: { type: string }
              name: { type: string }
              chainageFromM: { type: number, minimum: 0 }
              chainageToM: { type: number, exclusiveMinimum: 0 }
        facilities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, chainageM]
            properties:
              id: { type: string }
              name: { type: string }
              chainageM: { type: number, minimum: 0 }
        barriers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, health, chainageM]
            properties:
              id: { type: string }
              name: { type: string }
              health: { type: string, enum: [healthy, degraded, failed, unverified] }
              chainageM: { type: [number, 'null'], minimum: 0 }
        inspections:
          type: array
          items: { type: object, additionalProperties: true }
        threatCategories:
          type: array
          items: { type: object, additionalProperties: true }

    MapConfig:
      type: object
      required: [mapsApiKey]
      properties:
        mapsApiKey:
          type: string
          description: Browser key restricted to the FieldLoop HTTPS referrers and Maps JavaScript API.

    MapFeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { type: string, const: FeatureCollection }
        features:
          type: array
          items: { $ref: "#/components/schemas/MapFeature" }

    MapFeature:
      type: object
      required: [type, id, geometry, properties]
      properties:
        type: { type: string, const: Feature }
        id: { type: string }
        geometry: { $ref: "#/components/schemas/MapGeometry" }
        properties: { $ref: "#/components/schemas/MapFeatureProperties" }

    MapGeometry:
      oneOf:
        - type: object
          required: [type, coordinates]
          properties:
            type: { type: string, const: Point }
            coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        - type: object
          required: [type, coordinates]
          properties:
            type: { type: string, const: LineString }
            coordinates:
              type: array
              minItems: 2
              items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        - type: object
          required: [type, coordinates]
          properties:
            type: { type: string, const: Polygon }
            coordinates:
              type: array
              items:
                type: array
                minItems: 4
                items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }
        - type: object
          required: [type, coordinates]
          properties:
            type: { type: string, const: MultiPolygon }
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  minItems: 4
                  items: { type: array, minItems: 2, maxItems: 2, items: { type: number } }

    MapFeatureProperties:
      type: object
      additionalProperties: false
      properties:
        name: { type: [string, "null"] }
        code: { type: [string, "null"] }
        featureKind: { type: string, enum: [area, facility, linear, segment, barrier, consequence, geo_reference] }
        classification: { type: string }
        simulated: { type: boolean }
        label: { type: [string, "null"] }
        health: { type: [string, "null"], enum: [healthy, degraded, failed, unverified, null] }
        riskBand: { type: [string, "null"], enum: [intolerable, alarp, acceptable, null] }
        chainageFrom: { type: [number, "null"] }
        chainageTo: { type: [number, "null"] }
        evidenceObservedAt: { type: [string, "null"], format: date-time }
        domainPack: { type: [string, "null"] }
        geoReferenceId: { type: [string, "null"], format: uuid }
        assetId: { type: [string, "null"], format: uuid }
        documentId: { type: [string, "null"], format: uuid }
        geoReferenceKind: { type: [string, "null"], enum: [point, chainage, area, asset, null] }
        sourceSnippet: { type: [string, "null"] }
        confidence: { type: [number, "null"], minimum: 0, maximum: 1 }

    GeoReference:
      type: object
      additionalProperties: false
      required: [id, documentId, documentTitle, kind, geometry, chainageFrom, chainageTo, proposedLabel, sourceSnippet, confidence, targetAssetId, status, simulated, classification, createdAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        kind: { type: string, enum: [point, chainage, area, asset] }
        geometry:
          oneOf:
            - { $ref: "#/components/schemas/MapGeometry" }
            - { type: "null" }
        chainageFrom: { type: [number, "null"] }
        chainageTo: { type: [number, "null"] }
        proposedLabel: { type: [string, "null"] }
        sourceSnippet: { type: string, minLength: 1, maxLength: 1200 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        targetAssetId: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [draft, confirmed, rejected] }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        createdAt: { type: string, format: date-time }

    GeoReferencePage:
      allOf:
        - $ref: "#/components/schemas/CursorPage"
        - type: object
          required: [items, limit]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/GeoReference" }
            limit: { type: integer, minimum: 1, maximum: 200 }

    GeoReferenceConfirm:
      type: object
      additionalProperties: false
      properties:
        targetAssetId: { type: string, format: uuid }

    GeoReferenceDraftCreate:
      type: object
      additionalProperties: false
      required: [references]
      properties:
        references:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/GeoReferenceCandidate" }

    GeoReferenceCandidate:
      type: object
      additionalProperties: false
      required: [latitude, longitude, chainageFrom, chainageTo, assetCode, placeName, sourceSnippet, confidence]
      properties:
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        chainageFrom: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        chainageTo: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        assetCode: { type: [string, "null"], maxLength: 128 }
        placeName: { type: [string, "null"], maxLength: 256 }
        sourceSnippet: { type: string, minLength: 1, maxLength: 1200 }
        confidence: { type: number, minimum: 0, maximum: 1 }

    GeoReferenceDraftCreateResult:
      type: object
      additionalProperties: false
      required: [references, replayed]
      properties:
        references:
          type: array
          items: { $ref: "#/components/schemas/GeoReference" }
        replayed: { type: boolean }

    GeoSourceDocument:
      type: object
      additionalProperties: false
      required: [id, title, folder, text, simulated, classification]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        folder: { type: [string, "null"] }
        text: { type: string, minLength: 1, maxLength: 100000 }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }

    # BEGIN generated simulation schemas
    SimulationRun:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        orgId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        scenarioId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        scenarioName:
          type: string
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
        clock:
          type: string
          format: date-time
        elapsedSeconds:
          type: number
          minimum: 0
        durationSeconds:
          type: number
          minimum: 0
        state:
          type: string
          enum:
          - ready
          - playing
          - paused
          - finished
        nextEventIndex:
          type: integer
          minimum: 0
        eventCount:
          type: integer
          minimum: 0
        simulated:
          const: true
        classification:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - HIGHLY_RESTRICTED
        bookmarks:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                not:
                  pattern: '[\r\n]'
              name:
                type: string
                minLength: 1
                maxLength: 120
              atSeconds:
                type: number
                minimum: 0
            required:
            - id
            - name
            - atSeconds
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - orgId
      - scenarioId
      - scenarioName
      - seed
      - speed
      - clock
      - elapsedSeconds
      - durationSeconds
      - state
      - nextEventIndex
      - eventCount
      - simulated
      - classification
      - bookmarks
      - revision
    RunCreate:
      type: object
      additionalProperties: false
      properties:
        scenarioId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        seed:
          type: integer
          minimum: 0
          maximum: 2147483647
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
      required:
      - scenarioId
      - seed
      - speed
    PlayerCommand:
      type: object
      additionalProperties: false
      properties:
        speed:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
        bookmarkId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
      required: []
    ScenarioSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          not:
            pattern: '[\r\n]'
        name:
          type: string
        version:
          type: string
        durationSeconds:
          type: number
        simulated:
          const: true
        classification:
          type: string
          enum:
          - PUBLIC
          - INTERNAL
          - CONFIDENTIAL
          - HIGHLY_RESTRICTED
      required:
      - id
      - name
      - version
      - durationSeconds
      - simulated
      - classification
    # END generated simulation schemas
    HealthDecision:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required: [reason]
    HealthDecisionResult:
      type: object
      additionalProperties: false
      properties:
        healthProposalId: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected] }
        barrierId: { type: string, format: uuid }
        health: { type: string, enum: [healthy, degraded, failed, unverified] }
      required: [healthProposalId, status, barrierId, health]
    HealthProposal:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        barrierId: { type: string, format: uuid }
        barrierName: { type: [string, 'null'] }
        currentHealth: { type: [string, 'null'], enum: [healthy, degraded, failed, unverified, null] }
        proposedHealth: { type: string, enum: [healthy, degraded, failed, unverified] }
        sourceReason: { type: [string, 'null'] }
        simulated: { type: boolean }
        createdAt: { type: string, format: date-time }
      required: [id, barrierId, barrierName, currentHealth, proposedHealth, sourceReason, simulated, createdAt]
    HealthProposalPage:
      allOf:
      - $ref: '#/components/schemas/CursorPage'
      - type: object
        properties:
          items:
            type: array
            items: { $ref: '#/components/schemas/HealthProposal' }
          limit: { type: integer, minimum: 1, maximum: 200 }
        required: [items, limit]
    Notification:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        subjectType: { type: string, enum: [action_request, health_change, evidence] }
        subjectId: { type: string, format: uuid }
        barrierId: { type: [string, 'null'], format: uuid }
        channel: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
      required: [id, subjectType, subjectId, barrierId, channel, status, createdAt, simulated, classification]
    NotificationPage:
      allOf:
      - $ref: '#/components/schemas/CursorPage'
      - type: object
        properties:
          items:
            type: array
            items: { $ref: '#/components/schemas/Notification' }
          limit: { type: integer, minimum: 1, maximum: 200 }
        required: [items, limit]
    AuditEvent:
      type: object
      additionalProperties: false
      description: One append-only audit record. `hash` is the v1 SHA-256 of the record; the next record of the Organisation carries it as `prevHash`.
      properties:
        id: { type: string, format: uuid }
        entityType: { type: string, description: Action namespace, the text before the first dot of `action`. }
        entity: { type: string }
        action: { type: string }
        actor: { type: string }
        beforeHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        afterHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        prevHash: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        createdAt: { type: string, format: date-time }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
      required: [id, entityType, entity, action, actor, beforeHash, afterHash, prevHash, hash, createdAt, simulated, classification]
    AuditEventPage:
      allOf:
      - $ref: '#/components/schemas/CursorPage'
      - type: object
        properties:
          items:
            type: array
            items: { $ref: '#/components/schemas/AuditEvent' }
          limit: { type: integer, minimum: 1, maximum: 200 }
        required: [items, limit]
    CurrentUser:
      type: object
      required: [sub, roles, persona, orgId, clearance, csrfToken, authTime]
      properties:
        sub: { type: string }
        roles:
          type: array
          items: { type: string, enum: [fieldloop.viewer, fieldloop.operator, fieldloop.manager] }
        persona: { type: string }
        orgId: { type: string }
        clearance: { type: string }
        csrfToken: { type: string }
        authTime: { type: string, format: date-time }

    BowtieSummary:
      type: object
      additionalProperties: false
      required: [id, hazard, topEvent, domain, status, simulated, classification]
      properties:
        id: { type: string, format: uuid }
        hazard: { type: string }
        topEvent: { type: string }
        domain: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
    BowtieCanvas:
      type: object
      additionalProperties: false
      required: [id, hazard, topEvent, domain, status, simulated, classification, severityCriteria, threats, barriers, consequences, paths]
      properties:
        id: { type: string, format: uuid }
        hazard: { type: string }
        topEvent: { type: string }
        domain: { type: [string, 'null'] }
        status: { type: [string, 'null'] }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }
        severityCriteria:
          oneOf:
            - { $ref: '#/components/schemas/RiskSeverityCriteria' }
            - { type: 'null' }
        threats:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, frequencyPerYear]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              frequencyPerYear: { type: number, minimum: 0 }
        barriers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, type, side, health, pfdBand, degradationFactors]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { type: string, enum: [technical, organisational, human] }
              side: { type: string, enum: [preventive, mitigative] }
              health: { type: string, enum: [healthy, degraded, failed, unverified] }
              pfdBand: { type: number, exclusiveMinimum: 0, maximum: 1 }
              degradationFactors: { type: array, items: { type: string } }
        consequences:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name, severity]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              severity: { type: object, additionalProperties: { type: integer, minimum: 1, maximum: 5 } }
        paths:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, side, targetId, barrierIds]
            properties:
              id: { type: string }
              side: { type: string, enum: [preventive, mitigative] }
              targetId: { type: string, format: uuid }
              barrierIds: { type: array, items: { type: string, format: uuid } }
    RiskSnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [id, createdAt, trigger, calibration, snapshot]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        trigger: { type: string }
        calibration: { $ref: '#/components/schemas/RiskCalibration' }
        snapshot: { $ref: '#/components/schemas/RiskSnapshot' }
    RiskCalibration:
      type: object
      additionalProperties: false
      required: [standardRef, standardVersion, approvedBy, approvedAt]
      properties:
        standardRef: { type: string, minLength: 1 }
        standardVersion: { type: string, minLength: 1 }
        approvedBy: { type: string, minLength: 1 }
        approvedAt: { type: string, format: date-time }
    RiskSnapshot:
      type: object
      additionalProperties: false
      required: [bowtieId, topEventFrequencyPerYear, threats, consequences, worstConsequenceId, cell]
      properties:
        bowtieId: { type: string, format: uuid }
        topEventFrequencyPerYear: { type: number, minimum: 0 }
        threats: { type: array, items: { $ref: '#/components/schemas/RiskThreatResult' } }
        consequences: { type: array, items: { $ref: '#/components/schemas/RiskConsequenceResult' } }
        worstConsequenceId: { type: string, format: uuid }
        cell: { $ref: '#/components/schemas/RiskCell' }
    RiskThreatResult:
      type: object
      additionalProperties: false
      required: [threatId, frequencyPerYear, path]
      properties:
        threatId: { type: string, format: uuid }
        frequencyPerYear: { type: number, minimum: 0 }
        path: { $ref: '#/components/schemas/RiskPathResult' }
    RiskConsequenceResult:
      type: object
      additionalProperties: false
      required: [consequenceId, frequencyPerYear, severityBand, path, cell]
      properties:
        consequenceId: { type: string, format: uuid }
        frequencyPerYear: { type: number, minimum: 0 }
        severityBand: { type: integer, enum: [1, 2, 3, 4, 5] }
        path: { $ref: '#/components/schemas/RiskPathResult' }
        cell: { $ref: '#/components/schemas/RiskCell' }
    RiskPathResult:
      type: object
      additionalProperties: false
      required: [pathId, targetId, pfd, barriers]
      properties:
        pathId: { type: string, minLength: 1 }
        targetId: { type: string, format: uuid }
        pfd: { type: number, minimum: 0, maximum: 1 }
        barriers: { type: array, items: { $ref: '#/components/schemas/RiskBarrierCredit' } }
    RiskBarrierCredit:
      type: object
      additionalProperties: false
      required: [barrierId, health, effectivePfd, credited]
      properties:
        barrierId: { type: string, format: uuid }
        health: { type: string, enum: [healthy, degraded, failed, unverified] }
        effectivePfd: { type: number, minimum: 0, maximum: 1 }
        credited: { type: boolean }
    RiskCell:
      type: object
      additionalProperties: false
      required: [frequencyBand, severityBand, zone, rank]
      properties:
        frequencyBand: { type: integer, enum: [1, 2, 3, 4, 5] }
        severityBand: { type: integer, enum: [1, 2, 3, 4, 5] }
        zone: { type: string, enum: [green, amber, red] }
        rank: { type: integer, minimum: 1, maximum: 25 }
    RiskSeverityCriteria:
      type: object
      additionalProperties: false
      required: [people, environment, financial, serviceContinuity, reputation, legalRegulatory]
      properties:
        people: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
        environment: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
        financial: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
        serviceContinuity: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
        reputation: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
        legalRegulatory: { type: array, minItems: 5, maxItems: 5, items: { type: string, minLength: 1 } }
    RiskExplain:
      type: object
      additionalProperties: false
      required: [bowtieId, hasPrevious, summary, previous, current, changes, riskInputChanges]
      properties:
        bowtieId: { type: string, format: uuid }
        hasPrevious: { type: boolean }
        summary: { type: string }
        previous: { oneOf: [{ $ref: '#/components/schemas/RiskSnapshotEnvelope' }, { type: 'null' }] }
        current: { $ref: '#/components/schemas/RiskSnapshotEnvelope' }
        changes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [barrierId, beforeHealth, afterHealth, reason, sourceEvidenceId, sourceEvidenceHref, topEventFrequencyDeltaPerYear, consequenceFrequencyDeltasPerYear, impact]
            properties:
              barrierId: { type: string, format: uuid }
              beforeHealth: { type: string }
              afterHealth: { type: string }
              reason: { type: string }
              sourceEvidenceId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] }
              sourceEvidenceHref: { oneOf: [{ type: string }, { type: 'null' }] }
              topEventFrequencyDeltaPerYear: { type: number }
              consequenceFrequencyDeltasPerYear:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [consequenceId, delta]
                  properties:
                    consequenceId: { type: string, format: uuid }
                    delta: { type: number }
              impact: { type: number, minimum: 0 }
        riskInputChanges:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, beforeValue, afterValue]
            properties:
              path: { type: string, minLength: 1 }
              beforeValue: { oneOf: [{ type: string }, { type: 'null' }] }
              afterValue: { oneOf: [{ type: string }, { type: 'null' }] }
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: [id, barrierId, kind, source, observedAt, simulated, classification]
      properties:
        id: { type: string, format: uuid }
        barrierId: { type: string, format: uuid }
        kind: { type: string }
        source: { type: string }
        observedAt: { type: string, format: date-time }
        simulated: { type: boolean }
        classification: { type: string, enum: [PUBLIC, INTERNAL, CONFIDENTIAL, HIGHLY_RESTRICTED] }

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, n, e, kid, use, alg]
            properties:
              kty: { type: string, const: RSA }
              n: { type: string }
              e: { type: string }
              kid: { type: string }
              use: { type: string, const: sig }
              alg: { type: string, const: RS256 }

    ErrorCode:
      type: string
      description: Stable machine-readable error code. Clients branch on this, never on `title` or `detail`.
      enum:
        - validation_failed
        - unauthenticated
        - csrf_token_invalid
        - reauthentication_required
        - forbidden
        - not_found
        - method_not_allowed
        - conflict
        - idempotency_key_reused
        - payload_hash_mismatch
        - rate_limited
        - internal_error
        - service_unavailable
        - guardrail_blocked
        - payload_too_large
        - unsupported_media_type
        - risk_matrix_unconfigured
        - risk_matrix_invalid
        - risk_service_unavailable
        - risk_input_invalid

    Problem:
      type: object
      description: RFC 9457 problem details, with FieldLoop extension members `code`, `traceId` and `errors`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
          description: URI reference that identifies the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: HTTP status code of this response.
        detail:
          type: string
          description: Human-readable explanation of this occurrence. Never contains restricted data.
        instance:
          type: string
          format: uri-reference
          description: URI reference that identifies this occurrence.
        code:
          $ref: "#/components/schemas/ErrorCode"
        traceId:
          type: string
          description: OpenTelemetry trace ID of the request, for support and audit.
        errors:
          type: array
          description: Field-level errors. Present when `code` is `validation_failed`.
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required:
        - pointer
        - detail
      properties:
        pointer:
          type: string
          description: JSON Pointer (RFC 6901) to the invalid body member, or `#/query/<name>` or `#/header/<name>` for a parameter.
        detail:
          type: string
          description: What is wrong with the value.

    CursorPage:
      type: object
      description: |
        Envelope of every list response. A feature schema composes it with
        `allOf` and adds a required `items` array.
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - "null"
          description: Cursor for the next page, or `null` on the last page.

  responses:
    BadRequest:
      description: The request is malformed or fails validation (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds the Guardrail request size limit (`payload_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request uses an unsupported content type (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No valid session (`unauthenticated`). The SPA sends the user to `/auth/login`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GuardrailUnauthenticated:
      description: The verified internal user token is missing or invalid (`unauthenticated`). This service-to-service response does not start a browser login flow.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GuardrailForbidden:
      description: The token Organisation does not match this Guardrail service, or the caller's clearance or Guardrail policy blocks the request (`forbidden`, `clearance_denied`, or `guardrail_blocked`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The session may not do this: `forbidden`, `csrf_token_invalid`, or
        `reauthentication_required` when an approval needs a fresh login.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
