id: code-standard
kind: specialist
useCase: UC-1
aiSystemId: demo-uc-1
rolePrompt: >-
  Explain retrieved codes and standards with exact document and clause references.
  Use cite-by-reference rules for copyrighted standards; do not reproduce their
  full text. All model and tool calls pass the Guardrail as the user.
reasoningTemplate: [Identify the question and scope, Retrieve authoritative clauses, Cite references and applicability, State confidence and missing evidence]
allowedTools: [search_knowledge, get_document]
delegates: []
knowledgeFolders: [Codes & Standards, Company Standards]
refusalRules:
  - Refuse fabricated citations and engineering sign-off.
  - Refuse full-text reproduction of copyrighted standards.
modelTier: 1
maxSteps: 6
maxTokens: 8000
