version: 1.0.0
label: SIMULATION
simulated: true
classification: CONFIDENTIAL
parameterBasis: Authored PRD 6.1-C scenario; PFD values are AS-4 illustrative demo defaults. Threat
  frequencies and conditional probabilities are unknown and intentionally not seeded. All Barriers
  are Unverified until human-reviewed Evidence exists.
aiSystem:
  id: demo-uc-1
  name: UC-1 integrity assistant line-up (SIMULATION)
  useCase: UC-1
  modelTier: private
  dataClasses:
    - PUBLIC
    - INTERNAL
    - CONFIDENTIAL
    - HIGHLY_RESTRICTED
  tools:
    - search_knowledge
    - get_document
    - get_asset
    - get_barriers
    - get_bowtie_risk
    - extract_geo_references
    - create_draft
    - create_action_request
    - get_action_requests
    - spatial_query
  riskClass: high
  modelRoutes:
    - tier: private
      enabled: true
      boundary: private-in-country-no-retention
      modelClass: flash
    - tier: private
      enabled: true
      boundary: private-in-country-no-retention
      modelClass: pro
    - tier: public-saas
      enabled: false
      boundary: public-provider
      modelClass: flash
  agentPack: pipeline-integrity
  agentIds:
    - integrity-orchestrator
    - code-standard
    - regulatory
    - inspection-data-prep
    - pipeline-integrity
    - report-generator
policies:
  - id: injection-detector
    barrierId: injection-detector
    tier: tier-1
    mode: enforce
    failMode: fail-closed
    kind: injection
    detector: model-armor
    settings:
      scan: input-and-retrieved-content
      onDetection: block
      retrievedContentIsData: true
  - id: restricted-data-routing
    barrierId: classification-routing
    tier: tier-1
    mode: enforce
    failMode: fail-closed
    kind: classification-routing
    detector: sensitive-data-protection
    settings:
      routes:
        - classification: PUBLIC
          allowedModelTiers:
            - private
        - classification: INTERNAL
          allowedModelTiers:
            - private
        - classification: CONFIDENTIAL
          allowedModelTiers:
            - private
        - classification: HIGHLY_RESTRICTED
          allowedModelTiers:
            - private
      onDisallowedTier: reroute
      onNoAllowedTier: block
      publicSaasEnabled: false
  - id: output-dlp
    barrierId: output-dlp
    tier: tier-1
    mode: enforce
    failMode: fail-closed
    kind: output-dlp
    detector: sensitive-data-protection
    settings:
      scan: output
      onDetection: redact
      onUnsafeRedaction: block
  - id: system-of-record-tool-block
    barrierId: tool-call-policy
    tier: tier-1
    mode: enforce
    failMode: fail-closed
    kind: tool-call
    detector: tool-target-policy
    settings:
      allowedTools:
        - search_knowledge
        - get_document
        - get_asset
        - get_barriers
        - get_bowtie_risk
        - extract_geo_references
        - create_draft
        - create_action_request
        - get_action_requests
        - spatial_query
      blockedTargets:
        - SCADA
        - CMMS
        - GIS
        - asset-database
      onSystemOfRecordWrite: block
      onUnknownTool: block
      preparationTool: create_action_request
      preparationActionLevel: L1
      approvalRequired: true
bowtie:
  id: uc-1-bowtie-c
  hazard: An LLM with access to Highly Restricted documents
  topEvent: Restricted content or unsafe advice leaves the AI System
  domain: gen-ai
  status: draft
  independenceGroup:
    id: shared-guardrail-runtime
    cause: Shared Guardrail gateway and Tier 1 detector availability (SIMULATION)
    barrierIds:
      - injection-detector
      - tool-allowlist
      - classification-routing
      - dlp-redaction
      - tool-call-policy
      - output-dlp
  threats:
    - id: indirect-prompt-injection
      name: Indirect prompt injection in an uploaded contractor PDF
      categoryCode: prompt-injection
    - id: restricted-data-in-external-app
      name: User pastes restricted data into an external-model app
      categoryCode: restricted-data
    - id: hallucinated-engineering-clause
      name: Hallucinated clause in an engineering answer
      categoryCode: hallucinated-advice
    - id: agent-asset-database-write
      name: Agent tries to write to an asset database
      categoryCode: unsafe-tool-write
  consequences:
    - id: restricted-asset-data-disclosure
      name: Disclosure of restricted Asset data
      severity:
        dimension: security
        value: 5
    - id: wrong-engineering-decision
      name: Wrong engineering decision
      severity:
        dimension: people
        value: 4
  barriers:
    - id: injection-detector
      name: Injection detector (Tier 1)
      type: technical
      side: preventive
      pfdBand: 0.01
      health: unverified
      performanceStandard: Model Armor must scan input and retrieved content; a finding, timeout or error
        blocks. Evaluation results and Intercepts are required Evidence.
      implementation: tier-1-configured
      triad:
        effective:
          pass: true
          justification: Model Armor must scan input and retrieved content; a finding, timeout or error
            blocks. Evaluation results and Intercepts are required Evidence.
        independent:
          pass: true
          justification: Shared gateway failure dependencies are credited only through the declared
            Independence Group; procedural reviews are separate human processes.
        auditable:
          pass: true
          justification: Requires retained evaluation, Intercept or human review records. This seed supplies
            no operational Evidence.
      degradationFactors:
        - id: detector-drift
          description: Detector drift
          controls:
            - id: monthly-red-team-eval
              description: Monthly red-team evaluation
    - id: retrieved-text-as-data
      name: Retrieved text treated as data
      type: organisational
      side: preventive
      pfdBand: 0.1
      health: unverified
      performanceStandard: Retrieved text is never promoted into instructions; verify with agent misuse evaluation.
